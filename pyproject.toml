[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackcraft"
version = "0.1.0"
description = "A reproducible falling-block playground for decision models"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn"]

[project.scripts]
stackcraft = "stackcraft.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stackcraft"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
